name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run full test suite
        run: |
          set -o pipefail
          npm run test:all 2>&1 | tee /tmp/cp-ci.log || {
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 /tmp/cp-ci.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
