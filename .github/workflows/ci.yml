name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run full test suite
        run: |
          if npm run test:all > /tmp/cp-ci.log 2>&1; then
            echo 'Tests complets réussis.'
          else
            node scripts/ci-report-failure.mjs /tmp/cp-ci.log test:all
            exit 1
          fi
      - name: Parcours navigateur isolés
        run: |
          if npm run test:browser > /tmp/cp-browser.log 2>&1; then
            echo 'Parcours navigateur réussis.'
          else
            node scripts/ci-report-failure.mjs /tmp/cp-browser.log test:browser
            exit 1
          fi
      - name: Audit des dépendances
        run: npm audit --audit-level=high
